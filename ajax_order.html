<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax點餐</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-select-sm,
        .form-control-sm {
            width: 5 0%;
            min-height: calc(1.5em + 0.5rem + 2px);
        }

        .food-label {
            width: 50%;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-12 col-md-6">
                <form id="food-form" action="" class="rounded-3 border mb-3 p-3 row">
                    <label class="food-label" for="food-select">餐點</label>
                    <select id="food-select" class="form-select form-select-sm mb-3"
                        aria-label=".form-select-sm example">
                        <option value="請選擇" selected disabled>請選擇</option>
                        <!--                         
                        <option value="1">餐點1</option>
                        <option value="2">餐點2</option>
                        -->
                    </select>
                    <label class="food-label" for="food-amount">數量</label>
                    <input id="food-amount" type="number" value="1" min="1" step="1"
                        class="form-control form-control-sm">
                    <!--                     
                    <select id="pasta-select" class="form-select form-select-sm mb-3"
                        aria-label=".form-select-sm example">
                        <option selected disabled>請選擇</option>
                    </select>
                    -->
                    <button type="submit" id="food-submit" class="btn btn-primary mt-3">送出</button>
                </form>

                <form id="drink-form" action="" class="rounded-3 border p-3 row">
                    <label class="drink-label" for="drink-select">飲料</label>
                    <select id="drink-select" class="form-select form-select-sm mb-3"
                        aria-label=".form-select-sm example">
                        <option selected value="請選擇" disabled>請選擇</option>
                        <!--                         
                        <option value="1">餐點1</option>
                        <option value="2">餐點2</option>
                        -->
                    </select>
                    <label class="drink-label" for="drink-amount">數量</label>
                    <input id="drink-amount" type="number" value="1" min="1" step="1"
                        class="form-control form-control-sm">
                    <!--                     
                    <select id="pasta-select" class="form-select form-select-sm mb-3"
                        aria-label=".form-select-sm example">
                        <option selected disabled>請選擇</option>
                    </select>
                    -->
                    <button type="submit" id="drink-submit" class="btn btn-primary mt-3">送出</button>
                </form>
            </div>

            <div class="col-12 col-md-6">
                <h3>我的訂單</h3>
                <ul id="order-list-status" class="list-group">
                    <!--                     
                    <li class="list-group-item">An item</li>
                    <li class="list-group-item">A second item</li>
                    <li class="list-group-item">A third item</li>
                    <li class="list-group-item">A fourth item</li>
                     -->
                </ul>
                <ul class="order-result list-group">
                    <li class="list-group-item border-top-2 d-flex justify-content-between">
                        <span>總計：</span>
                        <span id="totalPrice" class="price">NT$ 800</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script>
        $(function () {
            let totalPrice = 0;
            let foodProductList = [];
            let drinkProductList = [];
            let orderStatusArray = [];

            const convertStringToNumber = (rawValue) => {
                const isEmpty =
                    rawValue === null ||
                    rawValue.trim() === "";

                const numberValue = Number(rawValue);

                const isValid =
                    !isEmpty &&
                    Number.isFinite(numberValue);

                if (!isValid) {
                    console.log("請輸入有效數字");
                } else {
                    //console.log("有效數字：", numberValue);
                    return numberValue;
                }
            }

            // 練習步驟 1：先想好如何辨認「同一個品項」。
            // 只用價格可能會誤判（不同品項可能同價），只用名稱也要留意餐點與飲料是否可能同名。
            // 可以替每個訂單項目保存「類別 + 品名」這類唯一識別資訊，之後才能找到已存在的項目。

            // 練習步驟 2：右側每個品項除了顯示文字，還需要保留目前的累計數量與單價。
            // 思考這些資料要存在 JavaScript 物件中，還是放在 <li> 的 data-* 屬性中；先選一種方式即可。

            $.ajax({
                url: "data/food.json",
                type: "GET",
                dataType: "json",
                success: function (data) {
                    $.each(data, function (index, value) {
                        $("#food-select").append($("<option>").text(value.name).val(index));
                        foodProductList.push({ id: index, name: value.name, price: value.price })
                    });
                }
            })

            $.ajax({
                url: "data/drink.json",
                type: "GET",
                dataType: "json",
                success: function (data) {
                    $.each(data, function (index, value) {
                        let newindex = index + foodProductList.length;
                        $("#drink-select").append($("<option>").text(value.name).val(newindex));
                        drinkProductList.push({ id: newindex, name: value.name, price: value.price });
                    });
                }
            })

            console.log(foodProductList);
            console.log(drinkProductList);

            $('#food-form').on('submit', function (event) {
                event.preventDefault();

                let foodSelect = $("#food-select").find("option:selected").text();
                let foodSelectIndex = convertStringToNumber($("#food-select").val());
                let foodSelectUnitPrice = foodProductList.find(item => item.name === foodSelect).unitprice;
                let foodAmount = convertStringToNumber($("#food-amount").val());

                // 練習步驟 3：表單值通常是字串。先把單價與本次數量轉成數字，
                // 並確認使用者真的選了餐點，避免把「請選擇」加入訂單。
                if (foodSelectUnitPrice === undefined || foodAmount === undefined) {
                    console.log("格式錯誤");
                    return;
                };

                // 練習步驟 4：根據步驟 1 設計的識別資訊，在 #order-list-status 中尋找相同餐點。
                // 先把搜尋結果存成變數，再用它的 length 判斷這是「重複品項」還是「新項目」。
                let order = orderStatusArray.find(item =>
                    item.name === foodSelect
                )

                console.log(foodSelect, foodSelectUnitPrice, foodAmount, new Date());
                // 練習步驟 5：若找到重複品項，讀出它原本的數量，加上這次輸入的數量，
                // 接著同步更新保存的數量，以及畫面上的「x 幾份」和該品項小計。
                if (order !== undefined) {
                    let origin_amount = orderStatusArray[foodSelectIndex].amount;
                    let new_amount = origin_amount + foodAmount;
                    orderStatusArray[foodSelectIndex].amount = new_amount;
                } else {
                    // 練習步驟 6：只有找不到相同品項時，才執行下面的 append。
                    // 建立新 <li> 時，別忘了同時保存日後查找所需的識別資訊、數量與單價。 
                    orderStatusArray.push({ id: foodSelectIndex, name: foodSelect, amount: foodAmount, unitprice: foodSelectUnitPrice })
                    // $('#order-list-status').append($('<li>').addClass('list-group-item').data("name", foodSelect).text(`${foodSelect} （\$ ${foodSelectUnitPrice}） x ${foodAmount} 份 = \$ ${foodSelectUnitPrice * foodAmount}`));
                }

                $('#order-list-status').empty();
                $.each(orderStatusArray, function (index, anOrder) {
                    $('#order-list-status').append($('<li>').addClass('list-group-item').data("name", anOrder.name).text(`${anOrder.name} （\$ ${anOrder.unitprice}） x ${anOrder.amount} 份 = \$ ${anOrder.unitprice * anOrder.amount}`));
                })

                // 練習步驟 7：不論是合併舊項目或新增項目，總計都只需加上「本次送出的金額」。
                // 完成型別轉換後，檢查這裡是否仍可能發生字串串接，而不是數字相加。
                totalPrice += foodSelectUnitPrice * foodAmount;
                $('#totalPrice').text(`NT\$ ${totalPrice}`)
            })

            $('#drink-form').on('submit', function (event) {
                event.preventDefault();

                let drinkSelect = $("#drink-select option:selected").text();
                let drinkSelectUnitPrice = convertStringToNumber($("#drink-select").find("option:selected").val());
                let drinkAmount = convertStringToNumber($("#drink-amount").val());

                if (drinkSelectUnitPrice === undefined || drinkAmount === undefined) {
                    console.log("格式錯誤");
                    return;
                };

                // 練習步驟 8：把餐點 handler 中完成的「驗證 → 查找 → 合併或新增 → 更新總計」流程
                // 套用到飲料。識別資訊要包含「飲料」類別，避免和同名餐點互相合併。

                // 進階整理（基本功能完成後再做）：觀察兩個 submit handler 哪些步驟幾乎相同，
                // 嘗試抽成一個共用函式，並以參數傳入類別、品名、單價與本次數量。
                console.log(drinkSelect, drinkSelectUnitPrice, drinkAmount, new Date());
                $('#order-list-status').append($('<li>').addClass('list-group-item').text(`${drinkSelect} （\$ ${drinkSelectUnitPrice}） x ${drinkAmount} 份 = \$ ${drinkSelectUnitPrice * drinkAmount}`));

                totalPrice += drinkSelectUnitPrice * drinkAmount;
                $('#totalPrice').text(`NT\$ ${totalPrice}`)
            })
        })
    </script>
</body>

</html>
